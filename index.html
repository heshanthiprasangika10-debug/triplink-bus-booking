  <script>
    window.TripLinkHeroSlidesPromise = fetch('api/hero_images.php', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Hero image list unavailable');
        return response.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.slides) || !data.slides.length) return null;
        var first = data.slides[0];
        var preload = document.createElement('link');
        preload.id = 'hero-image-preload';
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = first.src;
        if (first.type) preload.type = first.type;
        document.head.appendChild(preload);
        return data.slides;
      })
      .catch(function () { return null; });
  </script>
