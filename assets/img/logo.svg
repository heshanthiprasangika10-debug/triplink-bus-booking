<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6b49"/><stop offset="1" stop-color="#042b1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#e59e1c"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="4" y="8" width="80" height="80" rx="22" fill="url(#bg)"/>
  <rect x="4" y="8" width="80" height="80" rx="22" fill="none" stroke="#f2b632" stroke-opacity=".5" stroke-width="2"/>
  <!-- winding road -->
  <path d="M16 78 C 34 70, 20 56, 42 50 S 62 36, 66 24" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  <path d="M16 78 C 34 70, 20 56, 42 50 S 62 36, 66 24" fill="none" stroke="#f2b632" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
  <!-- pin with bus -->
  <path d="M52 14 c-10 0 -18 8 -18 18 c0 13 18 28 18 28 s18 -15 18 -28 c0 -10 -8 -18 -18 -18z" fill="url(#gold)"/>
  <rect x="42" y="24" width="20" height="15" rx="3" fill="#06402b"/>
  <rect x="44.500" y="26" width="5" height="5" rx="1" fill="#ffd35a"/>
  <rect x="51" y="26" width="5" height="5" rx="1" fill="#ffd35a"/>
  <rect x="57.500" y="26" width="3" height="5" rx="1" fill="#ffd35a"/>
  <circle cx="46" cy="40" r="2" fill="#06402b"/><circle cx="58" cy="40" r="2" fill="#06402b"/>
  <!-- wordmark -->
  <text x="100" y="56" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-1">Trip<tspan fill="#f2b632">Link</tspan></text>
  <text x="102" y="76" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="11.500" font-weight="500" fill="#bfe3d2" letter-spacing="3.200">EVERY SEAT · EVERY ROUTE</text>
</svg>
